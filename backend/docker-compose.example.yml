# Hardened single-host deployment example. Copy, set secrets in .env (never commit it), adjust limits.
# The reverse proxy (TLS, /ws/market routed to 3701) runs on the host and reaches the relay on loopback.
x-hardening: &hardening
  image: gapless-backend
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges=true
  pids_limit: 128
  restart: unless-stopped

services:
  # relay and jobs run as one container, not two services: they share one read-write volume
  # (jobs writes gap-index/jobs.sqlite, relay reads them straight off disk), and a platform
  # that gives each service its own isolated volume (Railway) can't share one between two
  # separate services. See backend/CLAUDE.md and ../README.md.
  relay-jobs:
    <<: *hardening
    command: ["scripts/start-relay-jobs.ts"]
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?set APP_ORIGIN}
      RELAY_INTERNAL_TOKEN: ${RELAY_INTERNAL_TOKEN:?set RELAY_INTERNAL_TOKEN}
      MONAD_HTTP_URLS: ${MONAD_HTTP_URLS:-}
      MONAD_WS_URL: ${MONAD_WS_URL:-}
      ENVIO_API_TOKEN: ${ENVIO_API_TOKEN:?set ENVIO_API_TOKEN}
      # The proxy reaches published ports from the bridge gateway; trust that one address only.
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "127.0.0.1:3700:3700"
      - "127.0.0.1:3701:3701"
    volumes:
      - gapless-data:/app/data
    mem_limit: 1.5g
    cpus: "2.0"
    healthcheck:
      # The slim image has no curl; Bun's fetch does the relay probe. Also checks jobs is still
      # producing: summary.json under 15 min old.
      test: ["CMD", "bun", "-e", "Promise.all([fetch('http://127.0.0.1:3700/healthz').then(r=>r.ok),new Promise(res=>{try{res(Date.now()-require('fs').statSync(process.env.OUT_DIR+'/summary.json').mtimeMs<900000)}catch{res(false)}})]).then(([a,b])=>process.exit(a&&b?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    # Jobs waits up to 30 s for a cycle to finish on SIGTERM; Docker's default is 10 s.
    stop_grace_period: 35s

volumes:
  gapless-data:
