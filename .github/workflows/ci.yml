name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Bun matches the backend image (oven/bun:1.4.2-slim); Foundry matches contract/foundry.toml.
env:
  BUN_VERSION: 1.4.2
  NODE_VERSION: 24
  FOUNDRY_VERSION: v1.8.3

# Actions are pinned by commit SHA; Dependabot bumps them with the trailing version comment.
jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-backend-${{ hashFiles('backend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-backend-
      - run: bun ci
      - run: bun run typecheck
      - run: bun test
      - name: ABI drift check (contract/abi vs src/abi)
        run: bun scripts/sync-abi.ts check

  contract:
    name: contract (forge)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contract
    env:
      FOUNDRY_PROFILE: ci
    steps:
      # contract/lib is vendored, so no submodule checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          # Its cache holds RPC and Etherscan responses only; this suite never forks.
          cache: false
      # solc (svm uses ~/.svm if present, else ~/.local/share/svm) plus incremental build artifacts.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.svm
            ~/.local/share/svm
            contract/cache
            contract/out
          key: forge-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('contract/foundry.toml', 'contract/**/*.sol') }}
          restore-keys: forge-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-
      - run: forge -V
      - run: forge build
      - run: forge test

  plugin:
    name: plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  indexer:
    name: indexer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version comes from the packageManager field (pnpm@10.32.0).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: indexer/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: indexer/pnpm-lock.yaml
      # pnpm freezes the lockfile by default when CI=true, which Actions always sets.
      - run: pnpm install
      # .envio/types.d.ts is gitignored and tsc needs it.
      - run: pnpm codegen
      - run: pnpm tsc
      - run: pnpm test

  cre:
    name: cre (gapless-ref)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cre/gapless-cre/gapless-ref
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-cre-${{ hashFiles('cre/gapless-cre/gapless-ref/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-cre-
      - run: bun ci
      - run: bun run typecheck
      - run: bun test

  # Single required check for branch protection: fails unless every job above succeeded.
  ci-result:
    name: CI result
    if: always()
    needs: [backend, contract, plugin, indexer, cre]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
